name: ci
on:
  push:
    branches: [main, v1]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - run: npm test
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upstream alignment report (fails on unmapped upstream capabilities)
        run: node tools/upstream-sync.mjs > alignment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-alignment
          path: alignment.json
