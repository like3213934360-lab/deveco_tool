name: ci
on:
  push:
    branches: [main, v1]
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # weekly: new upstream commits or capabilities fail the upstream job
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - run: npm test
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=optional
      - run: npm run build
      - name: Exhaustive upstream alignment (fails on undecided / partial items, stale decisions or new upstream commits)
        run: node tools/upstream-sync.mjs --json > alignment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-alignment
          path: alignment.json
