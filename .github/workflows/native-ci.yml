name: Native TypeScript validation
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Stage only native inputs before installing dependencies
        run: node --experimental-strip-types scripts/native-stage.ts "${{ runner.temp }}/native"
      - name: Retain locked native resolutions and remove legacy dependency records
        working-directory: ${{ runner.temp }}/native
        run: npm install --package-lock-only --ignore-scripts
      - name: Install native dependencies
        working-directory: ${{ runner.temp }}/native
        run: npm ci
      - name: Compile strict TypeScript
        working-directory: ${{ runner.temp }}/native
        run: npm run build
      - name: Run platform regressions with byte identities
        working-directory: ${{ runner.temp }}/native
        run: node dist/scripts/native-regression.js "${{ runner.temp }}/native-evidence"
      - name: Verify attributed resources
        working-directory: ${{ runner.temp }}/native
        run: node dist/scripts/resources.js
      - name: Check migration source coverage
        working-directory: ${{ runner.temp }}/native
        run: node dist/scripts/native-migration-audit.js
      - name: Keep framework and official toolchain upgrades separate
        working-directory: ${{ runner.temp }}/native
        run: node dist/scripts/upstream-scope.js "${{ github.workspace }}" "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.repository.default_branch }}"
      - name: Block unmapped or unreviewed upstream candidates
        working-directory: ${{ runner.temp }}/native
        run: node dist/scripts/upstream-gate.js
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/native-evidence
            ${{ runner.temp }}/native/package-lock.json
          if-no-files-found: warn
