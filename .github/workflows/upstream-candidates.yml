name: Upstream update candidates
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: upstream-candidates
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [deveco-code, deveco-cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install candidate tooling
        run: npm ci
      - name: Compile candidate tooling
        run: npm run build
      - name: Detect and prepare a pinned source proposal
        id: prepare
        run: node dist/scripts/upstream-prepare.js '${{ matrix.source }}' "$RUNNER_TEMP/candidate"
      - name: Publish a draft report and dispatch its validation
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node dist/scripts/upstream.js pr '${{ matrix.source }}' "$RUNNER_TEMP/candidate/candidate.json" --dispatch-validation
      - name: Retain detection and review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.source }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: warn
